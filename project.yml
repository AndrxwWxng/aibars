name: aibars
options:
  bundleIdPrefix: dev.aibars
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  schemePathPrefix: ""

schemes:
  aibars:
    build:
      targets:
        aibars: all
        aibarsCore: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - aibarsTests

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_NSHumanReadableCopyright: "MIT License"
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
    PRODUCT_NAME: aibars
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Carbon for `RegisterEventHotKey`, which is how the panel gets a global
    # shortcut without an Accessibility prompt. Named here beside the other two
    # rather than left to autolinking, because the frameworks this app links are
    # a list somebody should be able to read.
    OTHER_LDFLAGS: "-framework AppKit -framework SwiftUI -framework Carbon"

targets:
  aibarsCore:
    type: framework
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources
        excludes:
          - "**/*.entitlements"
    settings:
      base:
        PRODUCT_NAME: aibarsCore
        PRODUCT_BUNDLE_IDENTIFIER: dev.aibars.core
        DEFINES_MODULE: YES
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        SKIP_INSTALL: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO

  aibars:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: SourcesApp
        excludes:
          - "**/*.entitlements"
          - "**/Info.plist"
      # The app icon, and the only thing in the bundle that is not code. It is
      # on the *app* target rather than the framework because an asset catalog
      # named `AppIcon` is read by Finder and by Login Items off the bundle they
      # are looking at, and the framework is not that bundle.
      - path: Resources
    dependencies:
      - target: aibarsCore
    settings:
      base:
        PRODUCT_NAME: aibars
        PRODUCT_BUNDLE_IDENTIFIER: dev.aibars.app
        CODE_SIGN_ENTITLEMENTS: SourcesApp/aibars.entitlements
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        INFOPLIST_KEY_NSHumanReadableCopyright: "MIT License"
        INFOPLIST_KEY_CFBundleDisplayName: "AI Bars"

  aibarsTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Tests
    dependencies:
      - target: aibarsCore
    settings:
      base:
        PRODUCT_NAME: aibarsTests
        PRODUCT_BUNDLE_IDENTIFIER: dev.aibars.tests
        PRODUCT_MODULE_NAME: aibarsTests
        GENERATE_INFOPLIST_FILE: YES
