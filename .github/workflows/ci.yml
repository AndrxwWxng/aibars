name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # XcodeGen 2.45+ writes objectVersion 77, which only Xcode 16 and later
      # can read. Printing the toolchain makes that the first thing you see if
      # a runner image moves back.
      - name: Show toolchain
        run: xcodebuild -version

      - name: Build
        run: xcodebuild -project aibars.xcodeproj -scheme aibars -destination 'platform=macOS' build

      - name: Test
        run: xcodebuild -project aibars.xcodeproj -scheme aibars -destination 'platform=macOS' test
